<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge Jean-Petit</title>
<meta name="theme-color" content="#2C2A27">
<script>try{var th=localStorage.getItem("fjp-theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forge J-P">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='36' height='36' rx='9' fill='%232C2A27'/%3E%3Cpath d='M9 23h17c0-4 3-6 6-6v-3H15c-2 0-4 1.5-6 4z' fill='white'/%3E%3Cpath d='M15 23v5h-3v3h16v-3h-3v-5z' fill='white'/%3E%3Ccircle cx='31' cy='10' r='2' fill='%23F07A3F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a house logbook — slim header with tabs, one working surface below (calendar first, then lists). */
:root{
  /* Forge: iron-grey surfaces, charcoal ink, one ember accent */
  --bg:#ECEAE7; --surface:#FFFFFF; --sunk:#E4E1DD; --ink:#1F1D1A; --muted:#66615A; --line:#D7D3CD;
  --iron:#2C2A27; --accent:#B4461A; --on-accent:#FFFFFF; --ember:#B4461A; --ok:#2E7A4B; --danger:#A3262E; --today:#FBEDE4;
  --f1:#256ABF; --f2:#1BAF7A; --f3:#EDA100; --f4:#E87BA4; --f5:#008300; --f6:#6250D6; --f7:#CF3B3B; --on-fam:#FFFFFF;
  --on-f1:#FFFFFF; --on-f2:#1F1D1A; --on-f3:#1F1D1A; --on-f4:#1F1D1A; --on-f5:#FFFFFF; --on-f6:#FFFFFF; --on-f7:#FFFFFF;
  --wa:#1F7A4D;
  --font-display:"Young Serif", Georgia, "Times New Roman", serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141311; --surface:#1D1B19; --sunk:#292623; --ink:#ECE8E2; --muted:#A49E95; --line:#35312C;
  --iron:#3A3632; --accent:#F07A3F; --on-accent:#1C0F07; --ember:#F07A3F; --ok:#7CC796; --danger:#F08A8F; --today:#33231A;
  --f1:#3987E5; --f2:#199E70; --f3:#C98500; --f4:#D55181; --f5:#008300; --f6:#9085E9; --f7:#E66767; --on-fam:#141311;
  --on-f1:#141311; --on-f2:#141311; --on-f3:#141311; --on-f4:#141311; --on-f5:#FFFFFF; --on-f6:#141311; --on-f7:#141311;
  --wa:#2A8C5C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1D1B19; --sunk:#292623; --ink:#ECE8E2; --muted:#A49E95; --line:#35312C;
  --iron:#3A3632; --accent:#F07A3F; --on-accent:#1C0F07; --ember:#F07A3F; --ok:#7CC796; --danger:#F08A8F; --today:#33231A;
  --f1:#3987E5; --f2:#199E70; --f3:#C98500; --f4:#D55181; --f5:#008300; --f6:#9085E9; --f7:#E66767; --on-fam:#141311;
  --on-f1:#141311; --on-f2:#141311; --on-f3:#141311; --on-f4:#141311; --on-f5:#FFFFFF; --on-f6:#141311; --on-f7:#141311;
  --wa:#2A8C5C;
  color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

header{background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;flex:none}
.brand h1{font-size:1.55rem;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.who img{width:26px;height:26px;border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink);font-weight:600;font-size:.82rem;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.badge-admin{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ember);font-weight:700}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
/* Admin sits apart on the right, as a button */
nav.tabs #tab-settings:not([hidden]){margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:6px;padding:6px 14px 6px 11px;margin-bottom:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
nav.tabs #tab-settings svg{width:16px;height:16px}
nav.tabs #tab-settings:hover{border-color:var(--ember);color:var(--ember)}
nav.tabs #tab-settings[aria-selected="true"]{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 12%,var(--surface));color:var(--ember)}
.more-admin{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.more-admin.on,.more-admin:hover{border-color:var(--ember);color:var(--ember);background:color-mix(in srgb,var(--ember) 10%,var(--surface))}
.more-admin .bn-ico svg{width:18px;height:18px}

main{padding-block:22px 60px;display:grid;gap:22px}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ember);border-radius:var(--r);padding:14px 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-size:1.25rem}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 45%, var(--line))}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#FFFFFF}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;height:34px;justify-content:center;padding:0}

/* sign-in */
.gate{min-height:70vh;display:grid;place-items:center;padding-block:40px}
.gate .panel{max-width:440px;width:100%;display:grid;gap:14px;text-align:left}
.gate h2{font-size:1.6rem}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;width:100%}
.gbtn:hover{border-color:var(--muted)}
.hint{font-size:.84rem;color:var(--muted)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-head h2{font-size:1.5rem;min-width:9ch}
.cal-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-bottom:6px}
.dow span{padding-left:6px}
.weeks{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative}
.day{grid-row:1 / -1;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;border-top:0;border-left:0;padding:4px 6px;text-align:left;cursor:pointer;display:flex;align-items:flex-start;min-width:0;border-radius:0}
.day:hover{background:var(--sunk)}
.day .n{font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
.day.other .n{color:var(--muted);opacity:.55}
.day.weekend{background:color-mix(in srgb, var(--sunk) 45%, transparent)}
.day.today{background:var(--today)}
.day.today .n{background:var(--ember);color:var(--surface);border-radius:999px;padding:0 7px}
.bar{position:relative;z-index:1;margin:2px 3px;height:22px;border:0;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:700;color:var(--on-fam);cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:22px}
.bar.cont-l{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cont-r{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar.mine{box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--on-fam) 55%, transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

.list{display:grid;gap:8px;margin-top:14px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.row:hover{border-color:var(--muted)}
.row .when{font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.row .meta{color:var(--muted);font-size:.85rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .stripe{width:6px;align-self:stretch;border-radius:3px}
.row .right{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.check{display:grid;gap:2px;margin-top:14px}
.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--ok);flex:none}
.check label.done span{color:var(--muted);text-decoration:line-through}
.progress{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;min-width:0;align-content:start}
.card .role{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ember);font-weight:700}
.card h3{font-size:1.1rem;font-family:var(--font-body);font-weight:700}
.card .line{display:flex;align-items:center;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;min-width:0}
.card .line a,.card .line span{overflow-wrap:anywhere;color:var(--accent);text-decoration:none;font-weight:600}
.card .note{color:var(--muted);font-size:.88rem}
.copy{border:1px solid var(--line);background:none;border-radius:6px;padding:2px 8px;font-size:.75rem;cursor:pointer;color:var(--muted);flex:none}

.field{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:400;color:var(--ink);width:100%;min-width:0}
.field textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.warn{background:color-mix(in srgb, var(--ember) 12%, var(--surface));border:1px solid color-mix(in srgb, var(--ember) 40%, var(--line));border-radius:8px;padding:10px 12px;font-size:.88rem}
.warn label{display:flex;gap:8px;align-items:center;margin-top:6px;font-weight:600}
.err{color:var(--danger);font-size:.88rem}
.settings{display:grid;gap:18px}
.edit-list{display:grid;gap:6px;margin-top:10px}
.edit-item{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.edit-item input,.edit-item select{flex:1 1 140px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.edit-item .txt{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.edit-item .txt small{display:block;color:var(--muted)}
.admin-toggle{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.admin-toggle input{accent-color:var(--ember);width:16px;height:16px}

.export{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.export-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.export-row{display:flex;gap:8px;flex-wrap:wrap}
.done-banner{background:color-mix(in srgb, var(--ok) 14%, var(--surface));border:1px solid color-mix(in srgb, var(--ok) 40%, var(--line));border-radius:8px;padding:8px 12px;font-weight:700}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(540px, calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,14,13,.45)}
dialog{overscroll-behavior:contain}
.sheet-handle{touch-action:none}
.dlg{padding:20px;display:grid;gap:14px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dlg-head h2{font-size:1.35rem}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:600;z-index:50;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:560px){
  .bar{font-size:.68rem;padding:0 4px}
  .day{padding:3px}
  .day .n{font-size:.75rem}
  .cal-head h2{font-size:1.25rem}
  .row{grid-template-columns:auto 1fr}
  .row .right{grid-column:2;text-align:left}
}

.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;padding:3px 8px;font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.email-form{display:grid;gap:8px}
.email-form .edit-item input{flex:1 1 180px}
.ok-msg{background:color-mix(in srgb, var(--ok) 14%, var(--surface));border:1px solid color-mix(in srgb, var(--ok) 40%, var(--line));border-radius:8px;padding:10px 12px;font-size:.9rem}
.bulk textarea{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:.85rem;color:var(--ink);resize:vertical}
.bulk-table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:12px}
.bulk-table td,.bulk-table th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.bulk-table th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bulk-table select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:100%}
.scroll-x{overflow-x:auto}
.fam-preview{margin-top:10px;font-size:.88rem;display:flex;flex-wrap:wrap;gap:6px 14px}
.fam-preview span{display:inline-flex;align-items:center;gap:6px}
.tip-cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tip-cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer}
.tip-cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tip .addr{font-size:.9rem;overflow-wrap:anywhere}
.tip .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tip .links a{text-decoration:none}
.tip .by{font-size:.8rem;color:var(--muted);margin-top:4px}
.tip .acts{display:flex;gap:6px;margin-top:6px}
.install{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px}
.install p{margin:0;font-size:.9rem;min-width:0;flex:1 1 220px}
.cal-nav .seg{margin-right:6px}
.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px 22px}
.ym{min-width:0}
.ym h3{font-family:var(--font-body);font-size:.95rem;font-weight:700;margin:0 0 6px}
.ym h3 button{background:none;border:0;padding:0;font:inherit;cursor:pointer;color:var(--ink)}
.ym h3 button:hover{color:var(--accent);text-decoration:underline}
.ym-dow,.ym-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.ym-dow{margin-bottom:2px}
.ym-dow span{font-size:.62rem;text-align:center;color:var(--muted);font-weight:700}
.yd{aspect-ratio:1;border:0;border-radius:4px;background:var(--sunk);font-size:.72rem;font-variant-numeric:tabular-nums;cursor:pointer;padding:0;color:var(--ink);min-width:0}
.yd.blank{visibility:hidden}
.yd.booked{color:var(--on-fam);font-weight:700}
.yd.today{box-shadow:inset 0 0 0 2px var(--ember)}
.yd:hover{filter:brightness(.92)}
.legend .n{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.carnet{display:grid;gap:22px}
.note-form{display:grid;gap:8px;margin-top:12px}
.note-form textarea{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);resize:vertical}
.notes{display:grid;gap:8px;margin-top:14px}
.notes .note{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.notes .note.issue{border-left-color:var(--ember)}
.notes .note.resolved{opacity:.65}
.notes .note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.notes .note .meta{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.pill.issue{background:color-mix(in srgb,var(--ember) 18%,var(--surface));color:var(--ember)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.supplies{display:grid;gap:2px;margin-top:12px}
.supplies label{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.supplies input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.supplies .t{overflow-wrap:anywhere;min-width:0}
.supplies label.done .t{text-decoration:line-through;color:var(--muted)}
.supplies small{color:var(--muted);margin-left:auto;font-size:.75rem;white-space:nowrap}
.info-card .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}

/* toast with undo */
.toast:not([hidden]){display:flex;align-items:center;gap:16px}
.toast-undo{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:800;text-decoration:underline;cursor:pointer}
/* tile icons and Carnet badge */
.tile-top{display:flex;align-items:center;gap:8px;min-width:0}
.tile-ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--sunk);color:var(--ink);flex:none}
.tile-ico svg{width:16px;height:16px}
.tile.live .tile-ico{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.tile.attn .tile-ico{background:color-mix(in srgb,var(--ember) 18%,var(--surface));color:var(--ember)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.68rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
nav.tabs .badge{margin-left:6px}
.bn-ico{position:relative}
.bn .badge{position:absolute;top:-5px;right:-12px}
/* booking window */
.dlg.bk{padding:0;gap:0}
.bk-band{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;color:var(--on-fam)}
.bk-band-txt{display:grid;gap:2px;min-width:0}
.bk-fam{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.bk-band h2{font-size:1.5rem;color:inherit}
.bk-n{font-size:.88rem}
.bk-close{background:color-mix(in srgb,var(--on-fam) 20%,transparent);border:0;border-radius:50%;width:32px;height:32px;color:inherit;cursor:pointer;flex:none;font-size:.95rem}
.bk-body{display:grid;gap:14px;padding:16px 20px}
.bk-share{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.bk-more{flex:1 1 220px;min-width:0}
.bk-more summary{list-style:none;display:inline-flex;cursor:pointer}
.bk-more summary::-webkit-details-marker{display:none}
.bk-more[open] summary{border-color:var(--accent)}
.bk-more summary .bn-ico svg{width:18px;height:18px}
.bk-more .export-row{margin-top:8px}
.bk-foot{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;background:var(--surface);border-top:1px solid var(--line)}
.link.danger{color:var(--danger)}
/* date range picker */
.rp{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px}
.rp-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rp-dow,.rp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px 0}
.rp-dow span{font-size:.68rem;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase}
.rpd{height:40px;border:0;background:none;border-radius:8px;font-variant-numeric:tabular-nums;font-weight:600;cursor:pointer;color:var(--ink);padding:0;min-width:0}
.rpd.blank{visibility:hidden}
.rpd:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.rpd.past{color:var(--muted)}
.rpd.now span{border-bottom:2px solid var(--ember);padding-bottom:1px}
.rpd.inr{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-radius:0}
.rpd.rs,.rpd.re{background:var(--accent);color:var(--on-accent)}
.rpd.rs{border-radius:8px 0 0 8px}
.rpd.re{border-radius:0 8px 8px 0}
.rpd.rs.re{border-radius:8px}
.rp-sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.rp-sum .lbl{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.rp-arrow{color:var(--muted)}
.rp-sum .pill{margin-left:auto}
.rp-type summary{cursor:pointer;color:var(--muted);font-size:.85rem;font-weight:600}
.rp-type .grid2{margin-top:8px}
/* contacts */
.contact-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.contact .call{flex:1 1 auto;justify-content:center;text-decoration:none}
.contact .call .bn-ico svg{width:18px;height:18px}
.card .line .num{color:var(--ink);font-weight:600;overflow-wrap:anywhere;user-select:text}
/* family initials in phone month cells */
.mcd{display:grid;place-content:center;line-height:1.1}
.mcd-ini{font-size:.55rem;font-weight:800;letter-spacing:.04em}
/* loading placeholders */
.skel{display:grid;gap:22px}
.sk{display:block;background:var(--sunk);border-radius:6px;animation:skp 1.4s ease-in-out infinite}
.skel .tile{cursor:default;gap:10px}
.skel-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.skel-grid .sk{aspect-ratio:1.5;border-radius:8px}
@keyframes skp{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){ .sk{animation:none} }

/* statistics */
.admin-nav{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.tile.stat{cursor:default}
.tile .big{font-size:1.7rem;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.facts{margin:14px 0 0;padding:0 0 0 18px;display:grid;gap:4px;color:var(--muted);font-size:.9rem}
.chart-title{font-family:var(--font-body);font-size:1rem;font-weight:700;margin:0 0 14px}
.vbars{position:relative;height:210px;padding-left:40px}
.vb-grid{position:absolute;left:0;right:0;top:0;bottom:22px;pointer-events:none}
.vb-grid span{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.vb-grid span:nth-child(1){top:0}
.vb-grid span:nth-child(2){top:50%}
.vb-grid span:nth-child(3){top:100%}
.vb-grid span::before{content:attr(data-v);position:absolute;left:0;top:-.5em;background:var(--surface);padding-right:4px}
.vb-cols{position:relative;height:100%;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.vb-col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;outline:none}
.vb-plot{position:relative;flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.vb-bar{width:min(100%,26px);background:var(--accent);border-radius:4px 4px 0 0}
.vb-val{font-size:.72rem;font-weight:700;color:var(--ink);margin-bottom:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.vb-lbl .short{display:none}
.vb-lbl{height:22px;line-height:22px;font-size:.7rem;color:var(--muted);text-transform:capitalize;white-space:nowrap}
.vb-col:hover .vb-bar,.vb-col:focus-visible .vb-bar{filter:brightness(1.12)}
.hbars{display:grid;gap:12px}
.hb-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 11ch;align-items:center;gap:12px;outline:none}
.hb-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:14px;background:var(--sunk);border-radius:0 4px 4px 0;overflow:hidden}
.hb-bar{display:block;height:100%;border-radius:0 4px 4px 0}
.hb-val{font-size:.84rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:5;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:600;padding:5px 9px;border-radius:6px;white-space:nowrap;pointer-events:none}
.vb-col[data-tip]:hover::after,.vb-col[data-tip]:focus-visible::after{bottom:auto;top:-4px}
.hb-row[data-tip]:hover::after,.hb-row[data-tip]:focus-visible::after{left:auto;right:0;transform:none}
.stats-table{margin-top:16px}
.stats-table summary{cursor:pointer;color:var(--muted);font-size:.85rem;font-weight:600}
@media (max-width:720px){
  .admin-nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .admin-nav .an:last-child:nth-child(odd){grid-column:1/-1}
  .hb-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .hb-track{grid-column:1/-1;grid-row:2}
  .vbars{height:180px;padding-left:34px}
  .vb-cols{gap:3px}
  .vb-lbl .full{display:none}
  .vb-lbl .short{display:inline}
  .hb-row{grid-template-columns:minmax(0,1fr) auto}
  .stat-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile .big{font-size:1.4rem}
}

/* sliding windows (phones) */
.sheet-handle{display:none}
@keyframes sheet-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* friendly empty screens */
.empty-state{display:grid;justify-items:center;gap:10px;text-align:center;padding:26px 16px 18px;color:var(--muted)}
.es-ico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.es-ico svg{width:30px;height:30px}
.empty-state p{margin:0;max-width:38ch}
/* Bons plans */
.cat-chip{display:inline-flex;align-items:center;gap:6px;justify-self:start;background:var(--sunk);color:var(--ink);border-radius:999px;padding:3px 10px 3px 8px;font-size:.75rem;font-weight:700}
.cat-chip svg,.tip-cats svg{width:15px;height:15px}
.tip-cats button{display:inline-flex;align-items:center;gap:6px}
.tip .addr{display:flex;gap:6px;align-items:flex-start;color:var(--muted)}
.tip .pin svg{width:15px;height:15px;margin-top:3px}
/* Carnet in two columns on wide screens */
@media (min-width:1000px){ .carnet{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start} }
/* stay rows */
.row-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:.74rem;font-weight:800;letter-spacing:.02em;flex:none}
.rel{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap;justify-self:end}
.rel.now{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.rel.past{color:var(--muted)}
@media (min-width:1100px){ .cal-layout > section:last-child .row .rel{grid-column:2;justify-self:start} }
/* year view: whole month tappable on phones */
.ym-tap{display:block;width:100%;background:none;border:1px solid transparent;border-radius:10px;padding:6px;text-align:left;cursor:pointer;color:var(--ink)}
.ym-tap:hover,.ym-tap:focus-visible{border-color:var(--line);background:var(--sunk)}
.ym-tap h3{margin:0 0 6px}
@media (max-width:720px){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;border-width:1px 0 0;max-height:92vh;
    padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .2s ease-out}
  dialog[open]{animation:sheet-up .26s cubic-bezier(.2,.8,.2,1)}
  .sheet-handle{display:block;position:absolute;top:7px;left:50%;transform:translateX(-50%);width:40px;height:5px;border-radius:3px;
    background:color-mix(in srgb,var(--muted) 55%,transparent);z-index:3}
  .dlg{padding-top:24px}
  .dlg.bk{padding-top:0}
  .bk-band{padding-top:26px}
  .row .rel{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion: reduce){ dialog[open]{animation:none} dialog{transition:none} }

/* import */
.imp-box{display:grid;gap:14px}
.imp-sec{display:grid;gap:2px}
.imp-sec h3{font-family:var(--font-body);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 4px}
.imp-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.imp-row.static{cursor:default}
.imp-row input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.imp-row.exists .imp-main{opacity:.6}
.imp-main{display:grid;flex:1;min-width:0}
.imp-main strong{font-size:.92rem}
.imp-main .hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-av.sm{width:28px;height:28px;font-size:.62rem}

/* statistics: tappable parts */
.tile.stat.tap{cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.tile.stat.tap:hover{border-color:var(--muted)}
.vb-col.tap{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:6px}
.vb-col.tap:hover .vb-bar,.vb-col.tap:focus-visible .vb-bar{filter:brightness(1.15)}
.vb-col.dim .vb-bar{opacity:.4}
.vbars.small{height:150px}
.hb-row.tap{width:100%;background:none;border:0;padding:4px 0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:6px}
.hb-row.tap:hover .hb-bar,.hb-row.tap:focus-visible .hb-bar{filter:brightness(1.12)}
.hb-delta{display:block;font-size:.72rem;color:var(--muted);text-align:right}
.stats-2col{display:grid;gap:22px}
@media (min-width:1000px){ .stats-2col{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start} }

/* backups */
.backup-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.backup-bar.stale{border-left:4px solid var(--ember)}
.bb-ico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--sunk);color:var(--ink);flex:none}
.backup-bar.stale .bb-ico{background:color-mix(in srgb,var(--ember) 18%,var(--surface));color:var(--ember)}
.bb-ico svg{width:18px;height:18px}
.bb-txt{display:grid;flex:1 1 220px;min-width:0}
.bb-txt strong{font-size:.9rem}
.bb-acts{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
/* weather */
.wx{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tile .wx{gap:3px;flex-wrap:nowrap}
.tile .wx-d{min-width:0;flex:1 1 0;padding:4px 2px}
.wx-d{display:grid;justify-items:center;gap:0;min-width:40px;padding:4px 4px;border-radius:8px;background:var(--sunk);font-size:.72rem;line-height:1.25}
.wx-l{color:var(--muted);text-transform:capitalize}
.wx-i{font-size:1.05rem;line-height:1.2}
.wx-t{font-weight:700;color:var(--ink)}
.wx-m{color:var(--muted)}
.bk-wx{display:grid;gap:4px}
.bk-wx .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
/* header account button */
.top{flex-wrap:nowrap}
.brand h1{white-space:nowrap}
.avatar-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;color:var(--ink);font-weight:600;font-size:.88rem;min-width:0}
.avatar-btn:hover{border-color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;flex:none;display:inline-grid;place-items:center;color:var(--on-fam);font-size:.78rem;font-weight:700;object-fit:cover}
.avatar-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.account .lang{justify-self:start}
.acct-id{display:flex;gap:12px;align-items:center;min-width:0}
.acct-id h2{min-width:0;overflow-wrap:anywhere}
.acct-id .avatar{width:44px;height:44px;font-size:1rem}
.dlg{grid-template-columns:minmax(0,1fr)}
.dlg .admin-toggle{white-space:normal;align-items:flex-start;line-height:1.35}
.dlg .admin-toggle input{margin-top:1px}
/* today summary */
.today-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{display:grid;gap:3px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;min-width:0;color:var(--ink)}
.tile:hover{border-color:var(--muted)}
.tile .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tile .val{font-weight:700;font-size:1rem;min-width:0;overflow-wrap:anywhere}
.tile .sub{font-size:.84rem;color:var(--muted)}
.tile.live{border-left:4px solid var(--ok)}
.tile.attn{border-left:4px solid var(--ember)}
.val-fams{display:flex;flex-wrap:wrap;gap:2px 10px}
.fam-inline{display:inline-flex;align-items:center;gap:6px}
/* calendar + stays side by side on wide screens */
.cal-layout{display:grid;gap:22px;align-items:start;min-width:0}
.cal-layout > *{min-width:0}
@media (min-width:1100px){ .cal-layout{grid-template-columns:minmax(0,1fr) 350px} .cal-layout .year-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cal-layout > section:last-child .row{grid-template-columns:auto 1fr} .cal-layout > section:last-child .row .right{grid-column:2;text-align:left} }
/* compact month (phones) */
.mc-dow,.mc-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mc-dow{margin-bottom:4px}
.mc-dow span{font-size:.68rem;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.mcd{aspect-ratio:1;border:0;border-radius:8px;background:var(--sunk);font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer;padding:0;min-width:0}
.mcd.blank{visibility:hidden}
.mcd.booked{color:var(--on-fam);font-weight:700}
.mcd.today{box-shadow:inset 0 0 0 2px var(--ember)}
.mc-title{font-family:var(--font-body);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:18px 0 0}
/* compact note actions */
.link{background:none;border:0;padding:0;font:inherit;font-size:.8rem;font-weight:700;color:var(--accent);cursor:pointer}
.link:hover{text-decoration:underline}
.link.muted{color:var(--muted)}
.link.armed{color:var(--danger)}
.notes .note .meta .acts{margin-left:auto;display:inline-flex;gap:14px}
/* admin menu and lists */
.admin-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.an{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;color:var(--ink);font-weight:600;text-align:left;min-width:0}
.an:hover{border-color:var(--muted)}
.an.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.an-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-n{font-variant-numeric:tabular-nums;font-size:.75rem;font-weight:700;background:var(--sunk);color:var(--muted);border-radius:999px;padding:1px 8px}
.people-search{width:100%;margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink)}
.pgroups{display:grid;gap:18px;margin-top:14px}
.pg-head{display:flex;align-items:center;gap:8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-bottom:4px}
.prow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 6px;cursor:pointer;text-align:left;color:var(--ink);min-width:0}
.prow:hover{background:var(--sunk)}
.pr-main{display:grid;flex:1;min-width:0}
.pr-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-mail{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-chev{color:var(--muted);font-size:1.3rem;line-height:1}
.frows{display:grid;margin-top:12px}
.frow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.frow input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%;max-width:360px}
.frow .fm{grid-column:2;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}

/* smooth page changes */
#main{view-transition-name:page}
::view-transition-old(page),::view-transition-new(page){animation-duration:.24s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}
:root[data-vt="fwd"]::view-transition-old(page){animation-name:vt-out-l}
:root[data-vt="fwd"]::view-transition-new(page){animation-name:vt-in-r}
:root[data-vt="back"]::view-transition-old(page){animation-name:vt-out-r}
:root[data-vt="back"]::view-transition-new(page){animation-name:vt-in-l}
:root[data-vt="zoom"]::view-transition-old(page){animation-name:vt-zoom-out}
:root[data-vt="zoom"]::view-transition-new(page){animation-name:vt-zoom-in}
@keyframes vt-out-l{to{opacity:0;transform:translateX(-32px)}}
@keyframes vt-in-r{from{opacity:0;transform:translateX(32px)}}
@keyframes vt-out-r{to{opacity:0;transform:translateX(32px)}}
@keyframes vt-in-l{from{opacity:0;transform:translateX(-32px)}}
@keyframes vt-zoom-out{to{opacity:0;transform:scale(.97)}}
@keyframes vt-zoom-in{from{opacity:0;transform:scale(1.03)}}

@keyframes fade-in{from{opacity:0}}

  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}

}

/* ---------- calendar export ---------- */
const APP_LINK = location.origin + location.pathname.replace(/index\.html$/,"");
const compact = s => s.replace(/-/g,"");
function eventText(b){
  return {
    title: `Forge Jean-Petit · ${famName(b.family)}`,
    details: [t("stayAt",{range:fmtRange(b), nights:nightsTxt(nights(b))}),
      b.name?t("bookedByX",{name:b.name}):"", b.guests?t("peopleN",{n:b.guests})+".":"", b.note||"", `${t("calendarLink")}: ${APP_LINK}`].filter(Boolean).join("\n")
  };
}
const icsEscape = s => String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r\n|\r|\n/g,"\\n");
function icsFold(line){
  const enc=new TextEncoder(), out=[]; let cur="";
  for (const ch of line){ if (enc.encode(cur+ch).length>74){ out.push(cur); cur=" "+ch; } else cur+=ch; }
  out.push(cur); return out.join("\r\n");
}
function buildIcs(list){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Forge Jean-Petit//Bookings//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Forge Jean-Petit"];
  for (const b of list){
    const e = eventText(b);
    lines.push("BEGIN:VEVENT", `UID:${String(b.id).replace(/[^\w-]/g,"")}@forge-jean-petit`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${compact(b.start)}`, `DTEND;VALUE=DATE:${compact(ds(dn(b.end)+1))}`,
      `SUMMARY:${icsEscape(e.title)}`, `DESCRIPTION:${icsEscape(e.details)}`, "LOCATION:Forge Jean-Petit", "TRANSP:TRANSPARENT", "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.map(icsFold).join("\r\n")+"\r\n";
}
function downloadIcs(list, filename){
  const url = URL.createObjectURL(new Blob([buildIcs(list)], {type:"text/calendar;charset=utf-8"}));
  const a = h("a",{href:url, download:filename}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
const googleUrl = b => { const e=eventText(b);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.title)
    +"&dates="+compact(b.start)+"/"+compact(ds(dn(b.end)+1))+"&details="+encodeURIComponent(e.details)+"&location="+encodeURIComponent("Forge Jean-Petit"); };
const outlookUrl = (b,host) => { const e=eventText(b);
  return `https://${host}/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&allday=true&startdt=${b.start}&enddt=${ds(dn(b.end)+1)}`
    +"&subject="+encodeURIComponent(e.title)+"&body="+encodeURIComponent(e.details)+"&location="+encodeURIComponent("Forge Jean-Petit"); };
function exportBlock(b){

/* ---------- what's new since your last visit (remembered on this device) ---------- */
const NEWS_KEY = () => "fjp-seen:"+(S.email||"");
function newsLoad(){ try{ return JSON.parse(store.get(NEWS_KEY())||"null"); }catch(_){ return null; } }
function newsSave(x){ store.set(NEWS_KEY(), JSON.stringify(x)); }
const newsSnap = () => Object.fromEntries((S.raw.bookings||[]).map(b=>[b.id,[b.family||"", b.start, b.end]]));
function newsInit(){   // first visit on this device: start from now, nothing counts as new
  if (newsLoad()) return;
  const now=new Date().toISOString(); newsSave({b:newsSnap(), bookingsAt:now, carnetAt:now, tipsAt:now});
}
function newsAck(parts){
  const x=newsLoad(); if (!x) return; const now=new Date().toISOString();
  if (parts.includes("bookings")){ x.b=newsSnap(); x.bookingsAt=now; }
  if (parts.includes("carnet")) x.carnetAt=now;
  if (parts.includes("tips")) x.tipsAt=now;
  newsSave(x);
}
function newsForget(ids){
  const x=newsLoad(); if (!x || !ids.length) return ()=>{};
  const saved={}; for (const id of ids) if (id in x.b){ saved[id]=x.b[id]; delete x.b[id]; }
  newsSave(x);
  return ()=>{ const y=newsLoad(); if (y){ Object.assign(y.b,saved); newsSave(y); } };
}
function computeNews(){
  const x=newsLoad(); if (!x) return null;
  const me=uid(), td=todayStr(), since=(x.bookingsAt||"").slice(0,10), other=o=>o.uid!==me;
  const live=new Set((S.raw.bookings||[]).map(b=>b.id)), added=[], moved=[], cancelled=[];
  for (const b of S.bookings){
    if (!other(b) || b.end<since) continue;          // your own, or old stays added afterwards (imports)
    const o=x.b[b.id];
    if (!o) added.push(b); else if (o[1]!==b.start || o[2]!==b.end) moved.push({b, old:{start:o[1],end:o[2]}});
  }
  for (const [id,o] of Object.entries(x.b)) if (!live.has(id) && o[2]>=td) cancelled.push({id, family:o[0], start:o[1], end:o[2]});
  const notes=S.notes.filter(n=>other(n) && (n.createdAt||"")>x.carnetAt);
  const buys=S.supplies.filter(o=>other(o) && !o.done && (o.createdAt||"")>x.carnetAt);
  const tips=S.tips.filter(o=>other(o) && (o.createdAt||"")>x.tipsAt);
  const stays=added.length+moved.length+cancelled.length, carnet=notes.length+buys.length;
  return {added, moved, cancelled, notes, buys, tips, stays, carnet, n:stays+carnet+tips.length};
}
const tn = (k,n) => t(n===1?k+"1":k+"N",{n});
const isFresh = (o,k) => !!S.hl[k] && o.uid!==uid() && (o.createdAt||"")>S.hl[k];
function newsAll(){ newsAck(["bookings","carnet","tips"]); S.hl={carnet:null,tips:null}; render(); }
function renderNews(){

/* ---------- deleting with undo ---------- */
// A deletion waits 5 seconds before it is sent, so "Annuler" can bring it back.
const pendingDel = new Map();
function syncView(){
  const R=S.raw, keep=(arr,col)=>(arr||[]).filter(x=>!pendingDel.has(col+"/"+x.id));
  S.bookings=keep(R.bookings,"bookings"); S.notes=keep(R.notes,"notes"); S.supplies=keep(R.supplies,"supplies");
  S.tips=keep(R.tips,"tips"); S.members=keep(R.members,"members");
  S.settings = R.settings ? {...R.settings, checklist:keep(R.settings.checklist,"checklist"), contacts:keep(R.settings.contacts,"contacts")} : null;
  S.info = R.info ? {...R.info, sections:keep(R.info.sections,"info")} : null;
}
function softDelete(keys, message, commit){
  const entry={ keys:[].concat(keys), commit, done:false, timer:null };
  entry.timer=setTimeout(()=>finishDelete(entry), 5000);
  for (const k of entry.keys) pendingDel.set(k, entry);
  // your own deletions are not "news" for you
  const restoreSeen = newsForget(entry.keys.filter(k=>k.startsWith("bookings/")).map(k=>k.slice(9)));
  syncView(); render();
  const undo=()=>{ if (entry.done) return false; entry.done=true; clearTimeout(entry.timer); restoreSeen();
    for (const k of entry.keys) if (pendingDel.get(k)===entry) pendingDel.delete(k); syncView(); render(); return true; };
  toastUndo(message, undo);
  return undo;
}
function finishDelete(entry){
  if (entry.done) return; entry.done=true; clearTimeout(entry.timer);
  Promise.resolve().then(entry.commit).catch(e=>{ try{ fail(e); }catch(_){} })
    .finally(()=>{ for (const k of entry.keys) if (pendingDel.get(k)===entry) pendingDel.delete(k); syncView(); render(); });
}
function flushDeletes(){ for (const e of new Set(pendingDel.values())) finishDelete(e); }
addEventListener("pagehide", flushDeletes);
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="hidden") flushDeletes(); });
function toastUndo(msg, onUndo){
  const el=$("#toast");
  el.replaceChildren(h("span",{text:msg}), h("button",{type:"button",class:"toast-undo",text:t("undo"),onclick:()=>{ onUndo(); el.hidden=true; }}));
  el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true, 5000);
}

/* ---------- date range picker for bookings ---------- */
function rangePicker(st, onChange){
  const box=h("div",{class:"rp"});
  const draw=()=>{
    const [Y,M]=st.month.split("-").map(Number);
    const first=dn(st.month), days=new Date(Date.UTC(Y,M,0)).getUTCDate(), lead=(new Date(first*864e5).getUTCDay()+6)%7, T=dn(todayStr());
    const others=allBookings().filter(o=>o.id!==st.excludeId).map(o=>({...o,s:dn(o.start),e:dn(o.end)})).filter(o=>o.s<=first+days&&o.e>=first);
    const s=st.start?dn(st.start):null, e=st.end?dn(st.end):null;
    const title=new Date(first*864e5).toLocaleDateString(locale(),{timeZone:"UTC",month:"long",year:"numeric"});
    const move=d=>{ const dt=new Date(Date.UTC(Y,M-1+d,1)); st.month=dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-01"; draw(); };
    const cells=[]; for (let i=0;i<lead;i++) cells.push(h("span",{class:"rpd blank","aria-hidden":"true"}));
    for (let d=first; d<first+days; d++){
      const here=others.filter(o=>o.s<=d&&o.e>=d), fams=[...new Set(here.map(o=>o.family))];
      const tint=c=>`color-mix(in srgb, ${famColor(c)} 32%, var(--surface))`;
      const style = !fams.length ? null : fams.length===1 ? `background:${tint(fams[0])}` : `background:linear-gradient(135deg, ${tint(fams[0])} 50%, ${tint(fams[1])} 50%)`;
      const inRange = s!=null && e!=null && d>s && d<e;
      const cls=["rpd"]; if (here.length) cls.push("taken"); if (inRange) cls.push("inr"); if (d===s) cls.push("rs"); if (d===e || (e==null && d===s)) cls.push("re"); if (d<T) cls.push("past"); if (d===T) cls.push("now");
      const label=fmt(ds(d),{weekday:"long",day:"numeric",month:"long"})+(here.length?" · "+t("takenBy",{f:[...new Set(here.map(o=>famName(o.family)))].join(", ")}):"");
      cells.push(h("button",{type:"button",class:cls.join(" "),style:(d===s||d===e||inRange)?null:style,"aria-label":label,title:label,"aria-pressed":d===s||d===e,
        onclick:()=>{ if (st.phase!=="end" || s==null || d<s){ st.start=ds(d); st.end=null; st.phase="end"; } else { st.end=ds(d); st.phase="start"; } onChange(); draw(); }},
        h("span",{text:String(d-first+1)})));
    }
    const n = (s!=null&&e!=null) ? e-s : null;
    box.replaceChildren(
      h("div",{class:"rp-head"},
        h("button",{type:"button",class:"btn icon-btn","aria-label":t("prevMonth"),text:"‹",onclick:()=>move(-1)}),
        h("strong",{text:title.charAt(0).toUpperCase()+title.slice(1)}),
        h("button",{type:"button",class:"btn icon-btn","aria-label":t("nextMonth"),text:"›",onclick:()=>move(1)})),
      h("div",{class:"rp-dow","aria-hidden":"true"}, t("dow").map(x=>h("span",{text:x.slice(0,2)}))),
      h("div",{class:"rp-grid"}, cells),
      h("div",{class:"rp-sum"},
        h("div",null, h("span",{class:"lbl",text:t("arrival")}), h("strong",{text:st.start?fmt(st.start,{weekday:"short",day:"numeric",month:"short"}):"—"})),
        h("span",{class:"rp-arrow","aria-hidden":"true",text:"→"}),
        h("div",null, h("span",{class:"lbl",text:t("departure")}), h("strong",{text:st.end?fmt(st.end,{weekday:"short",day:"numeric",month:"short",year:"numeric"}):(st.start?t("pickDeparture"):"—")})),
        n!=null ? h("span",{class:"pill",text:nightsTxt(n)}) : null));
  };
  box.redraw=draw; draw(); return box;
}

function vt(kind, fn){

    fn(); if (calmMotion()) return;
    const el = kind==="zoom" ? main.querySelector(".cal-layout > :first-child") : main.querySelector(".mc-days, .weeks, .year-grid");
    el?.classList.add("anim-"+kind);
    if (kind!=="zoom") main.querySelector(".cal-head h2")?.classList.add("anim-fade");
    return;
  }
  if (!document.startViewTransition || calmMotion() || document.hidden){ fn(); return; }
  const r=document.documentElement; r.dataset.vt=kind;
  const tr=document.startViewTransition(fn);
  tr.finished.finally(()=>{ if (r.dataset.vt===kind) delete r.dataset.vt; });
}

function renderCalendar(){
  const [Y,M] = S.month.split("-").map(Number);
  const first = dn(S.month), last = first+new Date(Date.UTC(Y,M,0)).getUTCDate()-1;
  const gridStart = first - (new Date(first*864e5).getUTCDay()+6)%7;
  const today = dn(todayStr());
  const bookings = allBookings().map(b=>({...b, s:dn(b.start), e:dn(b.end)}));
  const title = new Date(first*864e5).toLocaleDateString(locale(),{timeZone:"UTC",month:"long",year:"numeric"});
  const shift = d => vt(d>0?"mfwd":"mback",()=>{ const dt=new Date(Date.UTC(Y,M-1+d,1)); S.month=dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-01"; render(); });
  const canBook = !!myFamily() || S.isMain;
  const head = h("div",{class:"cal-head"},
    h("h2",{text:title.charAt(0).toUpperCase()+title.slice(1)}),
    h("div",{class:"cal-nav"}, calSwitch(),
      h("button",{class:"btn icon-btn","aria-label":t("prevMonth"),text:"‹",onclick:()=>shift(-1)}),
      h("button",{class:"btn",text:t("today"),onclick:()=>{ const m=todayStr().slice(0,8)+"01"; if (m===S.month) return; vt(m>S.month?"mfwd":"mback",()=>{ S.month=m; render(); }); }}),
      h("button",{class:"btn icon-btn","aria-label":t("nextMonth"),text:"›",onclick:()=>shift(1)}),
      canBook ? h("button",{class:"btn primary hide-phone",text:t("newBooking"),onclick:()=>openForm(null, todayStr())}) : null));
  const dow = h("div",{class:"dow"}, t("dow").map(d=>h("span",{text:d})));
  const weeks = h("div",{class:"weeks"});
  for (let ws=gridStart; ws<=last; ws+=7){
    const we=ws+6, lanes=[], placed=[];
    for (const b of bookings.filter(b=>b.s<=we && b.e>=ws)){
      const cs=Math.max(b.s,ws), ce=Math.min(b.e,we);
      let lane=0; while(lanes[lane]!=null && lanes[lane]>=cs) lane++;
      lanes[lane]=ce; placed.push({b,cs,ce,lane});
    }
    const nl=Math.max(lanes.length,1);
    const week=h("div",{class:"week",style:`grid-template-rows:26px repeat(${nl},26px) 10px;min-height:${Math.max(84,36+nl*26)}px`});
    for (let i=0;i<7;i++){
      const d=ws+i, dstr=ds(d), cls=["day"];
      if(d<first||d>last) cls.push("other"); if(i>=5) cls.push("weekend"); if(d===today) cls.push("today");
      week.append(h("button",{class:cls.join(" "),style:`grid-column:${i+1}`,"aria-label":fmt(dstr,{weekday:"long",day:"numeric",month:"long"})+(canBook?t("bookFromDay"):""),
        onclick:()=>{ if(canBook) openForm(null,dstr); else toast(t("pickFamilyFirst")); }},
        h("span",{class:"n",text:new Date(d*864e5).getUTCDate()})));
    }
    for (const {b,cs,ce,lane} of placed){
      const cls=["bar"]; if(b.s<ws) cls.push("cont-l"); if(b.e>we) cls.push("cont-r"); if(canEdit(b)) cls.push("mine");
      week.append(h("button",{class:cls.join(" "),style:`grid-column:${cs-ws+1} / ${ce-ws+2};grid-row:${lane+2};background:${famColor(b.family)};color:${famInk(b.family)}`,
        title:`${famName(b.family)}${b.name?" ("+b.name+")":""}: ${fmtRange(b)}`,
        onclick:e=>{e.stopPropagation(); openDetail(b);}, text:famName(b.family)+(b.note?" · "+b.note:"")}));
    }
    weeks.append(week);
  }
  const legend = h("div",{class:"legend"}, families().map(f=>h("span",null,h("span",{class:"dot",style:`background:${famColor(f.id)}`}),famName(f.id))));
  return h("section",{class:"panel"}, head, dow, weeks, legend);
}

function renderYear(){

  const yb=allBookings().map(b=>({...b,s:dn(b.start),e:dn(b.end)})).filter(b=>b.s<=ye&&b.e>=ys);

    const lead=(new Date(mfirst*864e5).getUTCDay()+6)%7;
    const name=new Date(mfirst*864e5).toLocaleDateString(locale(),{timeZone:"UTC",month:"long"});
    const cells=[]; for (let i=0;i<lead;i++) cells.push(h("span",{class:"yd blank","aria-hidden":"true"}));
    for (let d=mfirst; d<mfirst+days; d++){
      const here=yb.filter(b=>b.s<=d&&b.e>=d), fams=[...new Set(here.map(b=>b.family))], dstr=ds(d);
      const style = dayFill(fams);
      const label = fmt(dstr,{weekday:"long",day:"numeric",month:"long"}) + (here.length ? ": "+[...new Set(here.map(b=>famName(b.family)))].join(", ") : "");
      cells.push(tapMonth
        ? h("span",{class:"yd"+(here.length?" booked":"")+(d===today?" today":""),style,"aria-hidden":"true",text:String(d-mfirst+1)})

function parseBulk(text){
  const rows=[], seen=new Set();
  for (const raw of text.split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    const m=line.match(/[^\s<>,;]+@[^\s<>,;]+\.[A-Za-z]{2,}/); if(!m) continue;
    const email=m[0].toLowerCase(); if(seen.has(email)) continue; seen.add(email);
    const name=line.slice(0,m.index).replace(/[<,;\-–]+\s*$/,"").replace(/^[\s,;]+/,"").trim();
    const fm=line.slice(m.index+m[0].length).match(/fam\w*\s*(\d)\s*(?:[-–:]\s*(.+?))?\s*[,;]?\s*$/i);
    const n=fm?Number(fm[1]):0;
    rows.push({email, name, family: n>=1&&n<=7?"f"+n:"", label: fm&&fm[2]?fm[2].trim():"", on:true});
  }
  return rows;
}

/* ---------- weather for an upcoming stay (Open-Meteo, Chimay) ---------- */
const HOUSE = { lat:50.0486, lon:4.3170 };
const WX = {};
function wxIcon(c){
  if (c===0) return "☀️"; if (c<=2) return "⛅"; if (c===3) return "☁️"; if (c===45||c===48) return "🌫️";
  if (c>=51&&c<=57) return "🌦️"; if (c>=61&&c<=67) return "🌧️"; if (c>=71&&c<=77) return "❄️";
  if (c>=80&&c<=82) return "🌦️"; if (c>=85&&c<=86) return "🌨️"; if (c>=95) return "⛈️"; return "·";
}
function stayWeather(b){
  if (!b) return null;
  const T=dn(todayStr()), s=dn(b.start), e=dn(b.end);
  if (s-T>7 || e<T) return null;
  const a=Math.max(s,T), z=Math.min(e, a+4, T+15), key=`${a}-${z}`;
  if (!WX[key]){
    WX[key]={state:"loading"};
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${HOUSE.lat}&longitude=${HOUSE.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBrussels&start_date=${ds(a)}&end_date=${ds(z)}`;
    fetch(url).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
      const dd=j.daily; WX[key]={state:"ok", days:dd.time.map((d,i)=>({d, code:dd.weather_code[i], max:dd.temperature_2m_max[i], min:dd.temperature_2m_min[i], rain:dd.precipitation_probability_max?.[i]}))};
      render();
    }).catch(()=>{ WX[key]={state:"err"}; setTimeout(()=>{ if (WX[key]?.state==="err"){ delete WX[key]; render(); } }, 60000); });
    return null;
  }
  if (WX[key].state!=="ok") return null;
  return h("span",{class:"wx","aria-label":t("weatherAt")},
    WX[key].days.map(x=>h("span",{class:"wx-d",title:`${fmt(x.d,{weekday:"long",day:"numeric",month:"long"})} · ${Math.round(x.max)}° / ${Math.round(x.min)}°${x.rain!=null?` · ${t("rainChance",{p:x.rain})}`:""}`},
      h("span",{class:"wx-l",text:fmt(x.d,{weekday:"short"}).replace(".","")}),
      h("span",{class:"wx-i","aria-hidden":"true",text:wxIcon(x.code)}),
      h("span",{class:"wx-t tnum",text:`${Math.round(x.max)}°`}),
      h("span",{class:"wx-m tnum",text:`${Math.round(x.min)}°`}))));
}

/* ---------- admin: statistics ---------- */
const DAY = 864e5;
const wdOf = d => (new Date(d*DAY).getUTCDay()+6)%7;            // 0 = Monday … 6 = Sunday
const yearRange = Y => [dn(`${Y}-01-01`), dn(`${Y}-12-31`)];
function statsSpan(){
  const all=allBookings(), now=new Date().getFullYear();
  const y0=all.length ? Math.min(now, ...all.map(b=>Number(b.start.slice(0,4)))) : now;
  const y1=Math.max(now, ...all.map(b=>Number(b.end.slice(0,4))));
  return {y0, y1};
}
// Everything below counts nights: the night of day d belongs to a stay when start <= d < end.
function computeRange(from, to){
  const total=to-from+1, T=dn(todayStr()), items=(S.settings?.checklist||[]).length;
  const bk=allBookings().map(b=>({...b,s:dn(b.start),e:dn(b.end)})).filter(b=>Math.min(b.e,to+1)>Math.max(b.s,from));
  const night=new Map(), famNights={}, famStays={};
  let stayNights=0, guestSum=0, guestN=0, chkSum=0, chkN=0;
  for (const b of bk){
    for (let d=Math.max(b.s,from); d<Math.min(b.e,to+1); d++){ if(!night.has(d)) night.set(d,new Set()); night.get(d).add(b.family); }
    stayNights+=nights(b); famNights[b.family]=(famNights[b.family]||0)+(Math.min(b.e,to+1)-Math.max(b.s,from));
    (famStays[b.family] ||= []).push(b);
    if (b.guests){ guestSum+=b.guests; guestN++; }
    if (items && b.e<T){ chkSum+=Object.keys(b.checklist||{}).length/items; chkN++; }
  }
  const months=Array.from({length:12},(_,i)=>({i,occ:0,len:0})), wd=Array.from({length:7},(_,i)=>({i,occ:0,len:0}));
  let wk=0, wkOcc=0, shared=0;
  for (let d=from; d<=to; d++){
    const m=new Date(d*DAY).getUTCMonth(), w=wdOf(d), occ=night.has(d);
    months[m].len++; wd[w].len++; if (occ){ months[m].occ++; wd[w].occ++; }
    if (w===4||w===5){ wk++; if (occ) wkOcc++; }
    if (occ && night.get(d).size>1) shared++;
  }
  for (const x of [...months,...wd]) x.rate = x.len ? x.occ/x.len : 0;
  const hits=(b,test)=>{ for (let d=Math.max(b.s,from); d<Math.min(b.e,to+1); d++) if (test(d)) return true; return false; };
  const allB=allBookings().map(b=>({s:dn(b.start),e:dn(b.end)}));
  let n90=0; for (let d=T; d<T+90; d++) if (allB.some(b=>b.s<=d&&d<b.e)) n90++;
  return { from, to, total, occupied:night.size, rate:night.size/total, stays:bk.length, avg:bk.length?stayNights/bk.length:0,
    months, wd, famNights, famStays, list:bk, weekendRate:wk?wkOcc/wk:0, shared, next90:n90/90,
    avgGuests:guestN?guestSum/guestN:null, chk:chkN?chkSum/chkN:null,
    weekendStays:bk.filter(b=>hits(b,d=>wdOf(d)===4||wdOf(d)===5)),
    sharedStays:bk.filter(b=>hits(b,d=>night.get(d)?.size>1)),
    monthStays:i=>bk.filter(b=>hits(b,d=>new Date(d*DAY).getUTCMonth()===i)) };
}
function computeStats(Y){ const [a,b]=yearRange(Y); return computeRange(a,b); }

  const canRemove = !isNew && !isMainRow && !isMe && !locked;
  showDlg(h("form",{class:"dlg",onsubmit:async e=>{
    e.preventDefault(); err.textContent="";
    const id=isNew ? email.value.trim().toLowerCase() : m.id;
    if (isNew && !isEmail(id)) { err.textContent=t("enterEmail"); return; }
    if (isNew && S.members.some(x=>x.id===id)) { err.textContent=t("personExists"); return; }
    const data={family:fam.value, name:name.value.trim()};
    if (S.isMain && !isMainRow) data.admin=adm.checked;
    save.disabled=true;
    try {
      if (isNew) await setDoc(doc(db,"members",id), {...data, admin:S.isMain?adm.checked:false, addedBy:S.email});
      else await updateDoc(doc(db,"members",id), data);
      dlg.close(); toast(isNew?t("canSignIn",{email:id}):t("saved"));
    } catch(e2){ save.disabled=false; try{fail(e2);}catch(_){} }
  }},
    h("div",{class:"dlg-head"},
      h("div",{class:"acct-id"}, m?personAvatar(m):null, h("h2",{text:isNew?t("addPersonTitle"):(m.name||m.id)})), closeBtn()),
    h("label",{class:"field"}, t("emailAddr"), email),
    h("div",{class:"grid2"}, h("label",{class:"field"}, t("name"), name), h("label",{class:"field"}, t("family"), fam)),
    S.isMain && !isMainRow ? h("label",{class:"admin-toggle",style:"justify-self:start"}, adm, t("makeAdmin")) : null,
    h("p",{class:"hint",text: isMainRow ? t("mainAdminHint") : locked ? t("lockedHint") : S.isMain ? t("adminHint") : t("coAdminHint")}),
    err,
    h("div",{class:"dlg-actions"},
      canRemove ? h("button",{type:"button",class:"btn danger",text:t("removeAccess"),onclick:()=>{ dlg.close(); softDelete("members/"+m.id, t("removed"), ()=>deleteDoc(doc(db,"members",m.id))); }}) : null,
      h("button",{type:"button",class:"btn",text:t("cancel"),onclick:()=>dlg.close()}), save)));
  setTimeout(()=>(isNew?email:name).focus(),50);
}

function removeButton(action){
  const b=h("button",{class:"btn ghost",text:t("remove")});

/* ---------- dialogs ---------- */
const dlg=$("#dlg");
function showDlg(content){
  dlg.replaceChildren(h("div",{class:"sheet-handle","aria-hidden":"true"}), content);
  dlg.style.transform="";
  if(!dlg.open){ lockPage(); dlg.showModal(); }
}
// On phones, windows slide up from the bottom and close with a swipe down.
// While a window is open the page behind stays still (iPhone otherwise scrolls it along with the swipe).
let lockedY=null;
function lockPage(){
  if (lockedY!=null) return; lockedY=scrollY;
  const b=document.body.style; b.position="fixed"; b.top=`-${lockedY}px`; b.left="0"; b.right="0"; b.width="100%";
}
function unlockPage(){
  if (lockedY==null) return; const y=lockedY; lockedY=null;
  const b=document.body.style; b.position=b.top=b.left=b.right=b.width="";
  scrollTo({top:y, behavior:"instant"});
}
{ let y0=null, dy=0;
  dlg.addEventListener("touchstart",e=>{ y0 = (isPhone() && dlg.scrollTop<=0) ? e.touches[0].clientY : null; dy=0; },{passive:true});
  dlg.addEventListener("touchmove",e=>{ if (y0==null) return; dy=e.touches[0].clientY-y0;
    if (dy>0 && dlg.scrollTop<=0){ e.preventDefault(); dlg.style.transition="none"; dlg.style.transform=`translateY(${dy}px)`; }
    else if (dy<0) y0=null; },{passive:false});
  dlg.addEventListener("touchend",()=>{ if (y0==null) return; dlg.style.transition="";
    if (dy>110) dlg.close(); else dlg.style.transform=""; y0=null; });
  dlg.addEventListener("close",()=>{ dlg.style.transform=""; dlg.style.transition=""; unlockPage(); });
}
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });
const closeBtn = () => h("button",{type:"button",class:"btn ghost icon-btn","aria-label":t("close"),text:"✕",onclick:()=>dlg.close()});

  const long={weekday:"long",day:"numeric",month:"long",year:"numeric"};

  const agenda=h("details",{class:"bk-more"},
    h("summary",{class:"btn"}, h("span",{class:"bn-ico",html:ICONS.calendar}), t("addToCal")),
    h("div",{class:"export-row"},
      h("button",{class:"btn",type:"button",text:t("appleIcs"),onclick:()=>downloadIcs([b], `forge-jean-petit-${b.start}.ics`)}),
      a(googleUrl(b),"Google Calendar"), a(outlookUrl(b,"outlook.live.com"),"Outlook.com"), a(outlookUrl(b,"outlook.office.com"),"Outlook 365")));
  const share=(justDone||canEdit(b)) ? h("a",{class:"btn wa",href:"https://wa.me/?text="+encodeURIComponent(whatsappText(b,justDone||"new")),target:"_blank",rel:"noopener"},
    h("span",{style:"display:inline-flex",html:WA_ICON}), t("shareWa")) : null;
  const remove=()=>{

  };
  showDlg(h("div",{class:"dlg bk"},
    h("div",{class:"bk-band",style:`background:${famColor(b.family)};color:${famInk(b.family)}`},
      h("div",{class:"bk-band-txt"},
        h("span",{class:"bk-fam",text:famName(b.family)}),
        h("h2",{text:fmtRange(b)}),
        h("span",{class:"bk-n",text:nightsTxt(nights(b))+(b.guests?" · "+t("peopleN",{n:b.guests}):"")})),
      h("button",{type:"button",class:"bk-close","aria-label":t("close"),text:"✕",onclick:()=>dlg.close()})),
    h("div",{class:"bk-body"},
      justDone ? h("div",{class:"done-banner",text:justDone==="edit"?t("changesSaved"):t("youBooked")}) : null,
      h("dl",{class:"kv"},
        h("dt",{text:t("bookedBy")}), h("dd",{text:(b.name||b.email||t("aMember"))+(canEdit(b)?" "+t("you"):"")}),
        h("dt",{text:t("arrival")}), h("dd",{text:fmt(b.start,long)}),
        h("dt",{text:t("departure")}), h("dd",{text:fmt(b.end,long)}),
        b.note?[h("dt",{text:t("noteLabel")}),h("dd",{text:b.note})]:null,
        items.length?[h("dt",{text:t("checklistLabel")}),h("dd",{class:"tnum",text:t("doneOf",{d:done,n:items.length})})]:null),
      (()=>{ const w=stayWeather(b); return w ? h("div",{class:"bk-wx"}, h("span",{class:"lbl",text:t("weatherAt")}), w) : null; })(),
      h("div",{class:"bk-share"}, share, agenda),
      share ? h("p",{class:"hint",text:t("waHint2")}) : null),
    h("div",{class:"bk-foot"},
      canDelete(b) ? h("button",{type:"button",class:"link danger",text:canEdit(b)?t("deleteBooking"):t("deleteAdmin"),onclick:remove}) : h("span",{class:"hint",text:t("onlyBooker")}),
      canEdit(b) ? h("button",{type:"button",class:"btn primary",text:t("edit"),onclick:()=>openForm(b)}) : null)));

function openCancelled(b, undo){
  showDlg(h("div",{class:"dlg"},
    h("div",{class:"dlg-head"}, h("h2",{text:t("bookingDeleted")}), closeBtn()),
    h("p",{class:"sub",text:t("nowFree",{family:famName(b.family),range:fmtRange(b)})}),
    notifyBlock(b,"cancel"),
    undo ? h("div",{class:"dlg-actions"}, h("button",{type:"button",class:"btn",text:t("undoDelete"),onclick:()=>{ if (undo()) toast(t("restored")); dlg.close(); }})) : null));
}

function openForm(b, startDefault){
  const isNew=!b;
  if (isNew && !myFamily() && !S.isMain) return toast(t("pickFamilyFirst"));
  const st = { start: b?b.start:startDefault, end: b?b.end:null, phase: b?"start":"end",
               month: (b?b.start:startDefault).slice(0,8)+"01", excludeId: b?.id };
  const start=h("input",{type:"date",id:"bk-start",value:st.start||""});
  const end=h("input",{type:"date",id:"bk-end",value:st.end||""});
  const guests=h("input",{type:"number",id:"bk-guests",min:"1",max:"50",value:b?.guests||"",placeholder:t("optional")});
  const note=h("textarea",{id:"bk-note",maxlength:"500",placeholder:t("notePh")}); note.value=b?.note||"";
  const famSel=isAdmin()?h("select",{id:"bk-fam"}, families().map(f=>h("option",{value:f.id,selected:(b?b.family:(myFamily()||families()[0].id))===f.id,text:famName(f.id)}))):null;
  const warnBox=h("div"), err=h("div",{class:"err"});
  let share=false;
  const check=()=>{
    warnBox.replaceChildren(); err.textContent="";
    if(!st.start||!st.end) return;
    if(st.end<st.start){ err.textContent=t("depAfter"); return; }
    const s=dn(st.start), e=Math.max(dn(st.end),s+1);
    const clash=allBookings().filter(o=>o.id!==b?.id && dn(o.start)<e && Math.max(dn(o.end),dn(o.start)+1)>s);
    if(clash.length) warnBox.append(h("div",{class:"warn"}, h("strong",{text:t("overlap")}), clash.map(o=>`${famName(o.family)} (${fmtRange(o)})`).join(", "),
      h("label",null,h("input",{type:"checkbox",id:"bk-share",checked:share,onchange:x=>share=x.target.checked}),t("shareHouse"))));
  };
  const picker=rangePicker(st, ()=>{ start.value=st.start||""; end.value=st.end||""; check(); });
  start.addEventListener("change",()=>{ if(!start.value) return; st.start=start.value; if(st.end && st.end<st.start){ st.end=null; end.value=""; } st.phase=st.end?"start":"end"; st.month=st.start.slice(0,8)+"01"; picker.redraw(); check(); });
  end.addEventListener("change",()=>{ st.end=end.value||null; st.phase="start"; picker.redraw(); check(); });
  const save=h("button",{class:"btn primary",type:"submit",text:isNew?t("bookDates"):t("saveChanges")});
  const form=h("form",{class:"dlg",onsubmit:async e=>{
    e.preventDefault(); check();
    if(!st.start||!st.end){ err.textContent=t("pickBothDates"); return; }
    if(err.textContent) return;
    if(warnBox.childNodes.length && !share){ err.textContent=t("confirmShare"); return; }
    const id=b?.id||newId();
    const data={ uid:uid(), email:S.email, name:S.authUser.displayName||memberName(S.email)||S.email,
      family: famSel?famSel.value:(b?.family||myFamily()), start:st.start, end:st.end, note:note.value.trim(),
      checklist:b?.checklist||{}, createdAt:b?.createdAt||new Date().toISOString(), updatedAt:new Date().toISOString() };
    if(guests.value) data.guests=Math.round(Number(guests.value));
    if(!data.family){ err.textContent=t("chooseAFamily"); return; }
    save.disabled=true;
    try{
      await setDoc(doc(db,"bookings",id), data);
      S.month=data.start.slice(0,8)+"01"; render();
      toast(isNew?t("booked"):t("bookingUpdated"));
      openDetail({...data,id}, isNew?"new":"edit");
    }catch(e2){ save.disabled=false; try{fail(e2);}catch(_){} }
  }},
    h("div",{class:"dlg-head"}, h("h2",{text:isNew?t("newBookingTitle"):t("editBooking")}), closeBtn()),
    h("p",{class:"hint",style:"margin:-6px 0 0",text:t("pickHint")}),
    picker,
    h("details",{class:"rp-type"}, h("summary",{text:t("orTypeDates")}),
      h("div",{class:"grid2"}, h("label",{class:"field"},t("arrival"),start), h("label",{class:"field"},t("departure"),end))),
    warnBox,
    h("div",{class:"grid2"},
      famSel?h("label",{class:"field"},t("family"),famSel):h("div",{class:"field"},t("family"),h("span",{class:"chip",style:"justify-self:start"},h("span",{class:"dot",style:`background:${famColor(myFamily())}`}),famName(myFamily()))),
      h("label",{class:"field"},t("peopleStaying"),guests)),
    h("label",{class:"field"},t("noteForOthers"),note),
    err,
    h("div",{class:"dlg-actions"}, h("button",{type:"button",class:"btn",text:t("cancel"),onclick:()=>dlg.close()}), save));
  showDlg(form); check();
}

/* ---------- tabs ---------- */
$("#fab").addEventListener("click",()=>openForm(null, todayStr()));
$("#tabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]"); if(!b) return;
  S.tab=b.dataset.tab; store.set("fjp-tab",S.tab); render();
});

/* ---------- live data ---------- */
function stopAll(){ S.unsubs.forEach(u=>u()); S.unsubs=[]; }
function startData(){
  if (S.unsubs.length>1) return;
  const onErr = e => { console.error(e); if(e.code==="permission-denied") toast(t("accessChanged")); };
  S.unsubs.push(onSnapshot(doc(db,"config","settings"), async snap=>{
    if (snap.exists()) { S.raw.settings=snap.data(); syncView(); }
    else if (isAdmin()) { try{ await setDoc(doc(db,"config","settings"), DEFAULT_SETTINGS); }catch(e){ console.error(e); } }
    render();
  }, onErr));
  S.unsubs.push(onSnapshot(collection(db,"bookings"), snap=>{ S.raw.bookings=snap.docs.map(d=>({id:d.id,...d.data()})); S.loaded=true; syncView(); render(); }, onErr));
  S.unsubs.push(onSnapshot(collection(db,"members"), snap=>{ S.raw.members=snap.docs.map(d=>({id:d.id,...d.data()})); syncView(); render(); }, onErr));
  S.unsubs.push(onSnapshot(collection(db,"tips"), snap=>{ S.raw.tips=snap.docs.map(d=>({id:d.id,...d.data()})); syncView(); render(); }, onErr));
  S.unsubs.push(onSnapshot(collection(db,"notes"), snap=>{ S.raw.notes=snap.docs.map(d=>({id:d.id,...d.data()})); syncView(); render(); }, onErr));
  S.unsubs.push(onSnapshot(collection(db,"supplies"), snap=>{ S.raw.supplies=snap.docs.map(d=>({id:d.id,...d.data()})); syncView(); render(); }, onErr));
  S.unsubs.push(onSnapshot(doc(db,"config","info"), snap=>{ S.raw.info=snap.exists()?snap.data():null; syncView(); render(); }, onErr));
}

S.month=todayStr().slice(0,8)+"01";
{ const tb=store.get("fjp-tab"); if(tb) S.tab=tb; if (store.get("fjp-calview")==="year") S.calView="year"; }
getRedirectResult(auth).catch(()=>{ S.signInError=t("signInFailed"); render(); });

// Arriving from an emailed sign-in link
if (isSignInWithEmailLink(auth, location.href)) {
  const saved = store.get("fjp-email");
  if (saved) finishEmailLink(saved); else S.needEmailConfirm = true;
}

onAuthStateChanged(auth, user=>{
  stopAll();
  flushDeletes(); S.authReady=true; S.loaded=false;
  S.authUser=user; S.member=null; S.memberLoaded=false; S.raw={bookings:[],notes:[],supplies:[],tips:[],members:[],settings:null,info:null}; syncView();
  if (!user){ S.email=null; S.isMain=false; render(); return; }
  S.email=(user.email||"").toLowerCase();
  S.isMain = S.email===MAIN_ADMIN;
  render();
  S.unsubs.push(onSnapshot(doc(db,"members",S.email), snap=>{
    S.member = snap.exists() ? snap.data() : null;
    S.memberLoaded = true;
    if (S.member || S.isMain) startData(); else { S.unsubs.slice(1).forEach(u=>u()); S.unsubs=S.unsubs.slice(0,1); }
    render();
  }, e=>{ console.error(e); S.memberLoaded=true; render(); }));
});
render();
